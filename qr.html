<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code - Guria Guide</title>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #74b9ff, #0984e3);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: white;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 400px;
        }
        h1 {
            color: #0984e3;
            margin-top: 0;
        }
        #qrcode {
            margin: 20px 0;
            display: flex;
            justify-content: center;
        }
        .url-info {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            color: #333;
        }
        .url-info code {
            background: #e9ecef;
            padding: 5px 10px;
            border-radius: 5px;
            display: block;
            margin-top: 10px;
            word-break: break-all;
            font-size: 14px;
        }
        .instructions {
            margin-top: 20px;
            color: #666;
            font-size: 14px;
            text-align: left;
        }
        .instructions ol {
            margin: 10px 0;
            padding-left: 20px;
        }
        .instructions li {
            margin: 8px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📱 Install Guria Guide</h1>
        <p style="color: #666;">Scan QR code with your phone</p>
        <div id="qrcode"></div>
        <div class="url-info">
            <strong>Or open this URL:</strong>
            <code id="app-url"></code>
        </div>
        <div class="instructions">
            <strong>Installation Steps:</strong>
            <ol>
                <li>Scan QR code or open URL on your phone</li>
                <li><strong>Android:</strong> Chrome menu → "Add to Home screen"</li>
                <li><strong>iOS:</strong> Safari Share → "Add to Home Screen"</li>
                <li>Open the app from your home screen</li>
            </ol>
        </div>
    </div>

    <script>
        // Get current URL
        const protocol = window.location.protocol;
        const hostname = window.location.hostname;
        const port = window.location.port || '8000';
        
        // Use local IP if available, otherwise localhost
        const appUrl = `${protocol}//${hostname}:${port}/index.html`;
        
        document.getElementById('app-url').textContent = appUrl;
        
        // Generate QR code
        new QRCode(document.getElementById("qrcode"), {
            text: appUrl,
            width: 256,
            height: 256,
            colorDark: "#000000",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.H
        });
    </script>
</body>
</html>
