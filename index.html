<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" content="Interactive audio guide for Guria region with geolocation tracking" />
    <meta name="theme-color" content="#0984e3" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Guria Guide" />
    <title>Guria QR Audio Guide</title>
    <link rel="manifest" href="./manifest.json" />
    <link rel="apple-touch-icon" href="./icons/icon-192x192.png" />
    <link rel="stylesheet" href="./src/style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
          crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
            crossorigin=""></script>
  </head>
  <body>
    <div class="splash">
      <img src="kacuna/guide.jpeg" alt="Guide" class="splash-image" />
      <div class="splash-overlay">
        <h1 class="splash-title">Guria QR Audio Guide</h1>
        <div class="lang-buttons">
          <button class="lang-btn" data-lang="en">English</button>
          <button class="lang-btn" data-lang="ru">Русский</button>
          <button class="lang-btn" data-lang="ge">ქართული</button>
        </div>
      </div>
    </div>

    <script>
      // When a language is selected, navigate to map.html with the lang param.
      document.querySelectorAll('.lang-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          const lang = btn.dataset.lang || 'en';
          // pass chosen language to map page
          location.href = 'map.html?lang=' + encodeURIComponent(lang);
        });
      });
    </script>
    <script>
      // Register service worker for PWA
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js')
            .then((registration) => {
              console.log('SW registered: ', registration);
            })
            .catch((registrationError) => {
              console.log('SW registration failed: ', registrationError);
            });
        });
      }
    </script>
  </body>
</html>
